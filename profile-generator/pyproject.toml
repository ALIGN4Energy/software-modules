[project]
name = "profile-generator"
version = "0.1.0"
description = "energy consumption profile generator"
readme = "README.md"
authors = [
    { name = "Nan Lin", email = "nansense97@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.1",
    "ema-pytorch>=0.7.9",
    "flow-matching>=1.0.10",
    "jaxtyping>=0.3.4",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "pydantic>=2.12.2",
    "pytest>=8.4.2",
    "pytorch-lightning>=2.6.0",
    "torch>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
lint.extend-select = [
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
lint.extend-ignore = ["F722", "F821", "E731"]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
